services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    container_name: gateway
    image: rapidlog-gateway
    restart: unless-stopped
    ports:
      - '${GATEWAY_PORT}:8080'
    environment:
      - GATEWAY_JOURNAL=${GATEWAY_JOURNAL}
      - GATEWAY_KRATOS_PUBLIC_URL=${GATEWAY_KRATOS_PUBLIC_URL}
    depends_on:
      - journal
      - kratos

  journal:
    build:
      context: .
      dockerfile: Dockerfile
      target: journal
    container_name: journal
    image: rapidlog-journal
    restart: unless-stopped
    ports:
      - '50052:50052'
    environment:
      - JOURNAL_DSN=${JOURNAL_DSN}
    depends_on:
      - db

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    container_name: kratos-migrate
    command: migrate sql -e --yes
    environment:
      DSN: ${KRATOS_DSN}
    depends_on:
      db:
        condition: service_healthy

  kratos:
    image: oryd/kratos:v26.2.0
    container_name: kratos
    restart: unless-stopped
    # --dev разрешает cookie без Secure по http://localhost
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    # URL берутся из kratos.yml (localhost:8080), остальное — из .env
    environment:
      DSN: ${KRATOS_DSN}
      SECRETS_COOKIE_0: ${KRATOS_SECRETS_COOKIE}
      SECRETS_CIPHER_0: ${KRATOS_SECRETS_CIPHER}
    volumes:
      - ./deploy/kratos:/etc/config/kratos:ro
    ports:
      # public API — для gateway, запущенного на хосте голым go run; admin (4434) наружу не пробрасываем
      - '4433:4433'
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully

  db:
    container_name: postgres
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rapidlog
      POSTGRES_PASSWORD: rapidlog
      POSTGRES_DB: rapidlog
    configs:
      - source: init-journal-db
        target: /docker-entrypoint-initdb.d/init-journal-db.sql
      - source: init-kratos-db
        target: /docker-entrypoint-initdb.d/init-kratos-db.sql
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'rapidlog']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

configs:
  init-journal-db:
    content: |
      CREATE DATABASE journal;
  init-kratos-db:
    content: |
      CREATE DATABASE kratos;
