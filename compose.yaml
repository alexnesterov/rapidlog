services:
  gateway:
    build:
      context: .
      target: gateway
    image: rapidlog-gateway
    restart: unless-stopped
    ports:
      - '${GATEWAY_PORT}:8080'
    environment:
      - GATEWAY_JOURNAL=${GATEWAY_JOURNAL}
      - GATEWAY_KRATOS_PUBLIC_URL=${GATEWAY_KRATOS_PUBLIC_URL}
    depends_on:
      journal:
        condition: service_started
      kratos:
        condition: service_started

  journal:
    build:
      context: .
      target: journal
    image: rapidlog-journal
    restart: unless-stopped
    environment:
      - JOURNAL_DSN=${JOURNAL_DSN}

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    command: migrate sql -e --yes
    environment:
      DSN: ${KRATOS_DSN}

  kratos:
    image: oryd/kratos:v26.2.0
    restart: unless-stopped
    command: serve -c /etc/config/kratos/kratos.yml --watch-courier
    environment:
      DSN: ${KRATOS_DSN}
      SECRETS_COOKIE_0: ${KRATOS_SECRETS_COOKIE}
      SECRETS_CIPHER_0: ${KRATOS_SECRETS_CIPHER}
      SERVE_PUBLIC_BASE_URL: ${KRATOS_APP_URL}/auth/
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: ${KRATOS_APP_URL}/
      SELFSERVICE_FLOWS_ERROR_UI_URL: ${KRATOS_APP_URL}/error
      SELFSERVICE_FLOWS_LOGIN_UI_URL: ${KRATOS_APP_URL}/login
      SELFSERVICE_FLOWS_REGISTRATION_UI_URL: ${KRATOS_APP_URL}/registration
      SELFSERVICE_FLOWS_LOGOUT_AFTER_DEFAULT_BROWSER_RETURN_URL: ${KRATOS_APP_URL}/login
    volumes:
      - ./deploy/kratos:/etc/config/kratos:ro
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
