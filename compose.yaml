services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    container_name: gateway
    image: rapidlog-gateway
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file:
      - .env
    depends_on:
      - journal
      - kratos

  identity:
    build:
      context: .
      dockerfile: Dockerfile
      target: identity
    container_name: identity
    image: rapidlog-identity
    restart: unless-stopped
    ports:
      - '50051:50051'
    env_file:
      - .env
    depends_on:
      - db

  journal:
    build:
      context: .
      dockerfile: Dockerfile
      target: journal
    container_name: journal
    image: rapidlog-journal
    restart: unless-stopped
    ports:
      - '50052:50052'
    env_file:
      - .env
    depends_on:
      - db

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    container_name: kratos-migrate
    command: migrate sql -e --yes
    environment:
      DSN: ${KRATOS_DSN:-postgres://rapidlog:rapidlog@db:5432/kratos?sslmode=disable}
    depends_on:
      db:
        condition: service_healthy

  kratos:
    image: oryd/kratos:v26.2.0
    container_name: kratos
    restart: unless-stopped
    # --dev разрешает cookie без Secure по http://localhost
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    # те же переменные, что в продакшене (docker-compose.yaml); дефолты — для .env без KRATOS_*
    environment:
      DSN: ${KRATOS_DSN:-postgres://rapidlog:rapidlog@db:5432/kratos?sslmode=disable}
      SECRETS_COOKIE_0: ${KRATOS_SECRETS_COOKIE:-local-dev-cookie-secret-change-me-32+}
      SECRETS_CIPHER_0: ${KRATOS_SECRETS_CIPHER:-32-long-local-dev-cipher-secret!}
      SERVE_PUBLIC_BASE_URL: ${KRATOS_APP_URL:-http://localhost:8080}/.ory/
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: ${KRATOS_APP_URL:-http://localhost:8080}/
      SELFSERVICE_FLOWS_ERROR_UI_URL: ${KRATOS_APP_URL:-http://localhost:8080}/error
      SELFSERVICE_FLOWS_LOGIN_UI_URL: ${KRATOS_APP_URL:-http://localhost:8080}/login
      SELFSERVICE_FLOWS_REGISTRATION_UI_URL: ${KRATOS_APP_URL:-http://localhost:8080}/registration
      SELFSERVICE_FLOWS_LOGOUT_AFTER_DEFAULT_BROWSER_RETURN_URL: ${KRATOS_APP_URL:-http://localhost:8080}/login
    volumes:
      - ./deploy/kratos:/etc/config/kratos:ro
    ports:
      # public API — для gateway, запущенного на хосте голым go run; admin (4434) наружу не пробрасываем
      - '4433:4433'
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully

  db:
    container_name: postgres
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rapidlog
      POSTGRES_PASSWORD: rapidlog
      POSTGRES_DB: rapidlog
    configs:
      - source: init-identity-db
        target: /docker-entrypoint-initdb.d/init-identity-db.sql
      - source: init-journal-db
        target: /docker-entrypoint-initdb.d/init-journal-db.sql
      - source: init-kratos-db
        target: /docker-entrypoint-initdb.d/init-kratos-db.sql
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'rapidlog']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    container_name: adminer
    image: adminer
    restart: unless-stopped
    ports:
      - 8081:8080
    depends_on:
      - db

volumes:
  postgres_data:

configs:
  init-identity-db:
    content: |
      CREATE DATABASE identity;
  init-journal-db:
    content: |
      CREATE DATABASE journal;
  init-kratos-db:
    content: |
      CREATE DATABASE kratos;
