<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23151316'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e8a33d'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Golos+Text:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>RapidLog</title>
    <!-- Сплэш первой загрузки: виден с первого кадра, до загрузки JS и шрифтов. Убирается в
         app/main.tsx, когда роутер завершил первый переход (страница уже нарисована нужными
         шрифтами). Копия shared/ui/splash: CSS-токены из index.css здесь ещё не загружены. -->
    <style>
      #boot-splash {
        --bs-paper: #f7f3ea;
        --bs-ink: #151316;
        --bs-accent: #c97a2b;
        --bs-line: rgba(21, 19, 22, 0.14);
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: var(--bs-paper);
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash {
          --bs-paper: #17151b;
          --bs-ink: #ece7de;
          --bs-accent: #e8a33d;
          --bs-line: rgba(247, 243, 234, 0.08);
        }
      }
      #boot-splash .boot-splash__mark {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: var(--bs-ink);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot-splash .boot-splash__dot {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--bs-accent);
      }
      #boot-splash .boot-splash__spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid var(--bs-line);
        border-top-color: var(--bs-accent);
      }
      @media (prefers-reduced-motion: no-preference) {
        #boot-splash .boot-splash__spinner {
          animation: boot-splash-spin 0.8s linear infinite;
        }
      }
      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-splash__mark"><span class="boot-splash__dot"></span></div>
      <div class="boot-splash__spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
