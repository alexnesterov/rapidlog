<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3E.s{stroke:%23151316}@media (prefers-color-scheme: dark){.s{stroke:%23ece7de}}%3C/style%3E%3Cpath fill='%23b3432f' d='M8.6 10.4c3.4-.2 6 2.3 5.9 5.6-.1 3.4-2.9 5.8-6.2 5.5-3-.2-5.3-2.7-5-5.8.2-2.8 2.5-5.1 5.3-5.3z'/%3E%3Cpath class='s' fill='none' stroke-width='3.6' stroke-linecap='round' d='M18.6 17.1c2.4-.5 5-.2 7.4-.4 1.3-.1 2.4-.3 3.6-.4'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Golos+Text:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>RapidLog</title>
    <!-- Сплэш первой загрузки: виден с первого кадра, до загрузки JS и шрифтов. Убирается в
         app/main.tsx, когда роутер завершил первый переход (страница уже нарисована нужными
         шрифтами). Копия shared/ui/splash: CSS-токены из index.css здесь ещё не загружены. -->
    <style>
      #boot-splash {
        --bs-paper: #f7f3ea;
        --bs-ink: color-mix(in srgb, #151316 78%, #f7f3ea);
        --bs-accent: #b3432f;
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bs-paper);
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash {
          --bs-paper: #17151b;
          --bs-ink: color-mix(in srgb, #ece7de 78%, #17151b);
          --bs-accent: #e07a5f;
        }
      }
      #boot-splash .boot-splash__mark {
        display: block;
        width: 120px;
        height: 48px;
        overflow: visible;
      }
      #boot-splash .boot-splash__dot {
        fill: var(--bs-accent);
      }
      #boot-splash .boot-splash__stroke {
        fill: none;
        stroke: var(--bs-ink);
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      @media (prefers-reduced-motion: no-preference) {
        #boot-splash .boot-splash__stroke {
          stroke-dasharray: 1;
          animation: boot-splash-write 1.4s ease-in-out infinite;
        }
      }
      @keyframes boot-splash-write {
        0% {
          stroke-dashoffset: 1;
          opacity: 1;
        }
        55% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        85% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        100% {
          stroke-dashoffset: 0;
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <svg class="boot-splash__mark" viewBox="0 0 40 16">
        <path
          class="boot-splash__dot"
          d="M5.3 4.3c2.2-.1 3.9 1.5 3.8 3.6-.1 2.2-1.9 3.7-4 3.5-1.9-.1-3.4-1.7-3.2-3.7.1-1.8 1.6-3.3 3.4-3.4z"
        />
        <path
          class="boot-splash__stroke"
          d="M13.2 9.4c1.6-2.3 3.1-2.4 4.2-.4s2.4 2 3.8-.1 2.6-2.3 3.9-.2 2.5 1.9 3.9-.1 2.8-1.6 4.4-.6c1.1.6 2.4.6 3.9.1"
          pathLength="1"
        />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
