syntax = "proto3";

package journal.v1;

option go_package = "github.com/alexnesterov/rapidlog-api/api/gen/journal/v1;journalv1";

import "google/protobuf/timestamp.proto";

enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_TASK        = 1;
  KIND_EVENT       = 2;
  KIND_NOTE        = 3;
}

enum Signifier {
  SIGNIFIER_UNSPECIFIED = 0;
  SIGNIFIER_OPEN        = 1;
  SIGNIFIER_COMPLETED   = 2;
  SIGNIFIER_CANCELLED   = 3;
}

message Bullet {
  string                    id         = 1;
  string                    user_id    = 2;
  Kind                      kind       = 3;
  Signifier                 signifier  = 4;
  string                    content    = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message CreateBulletRequest {
  Kind   kind    = 1;
  string content = 2;
  string user_id = 3;
}

message CreateBulletResponse {
  Bullet data = 1;
}

message ListBulletsRequest {
  string user_id = 1;
}

message ListBulletsResponse {
  repeated Bullet data = 1;
}

message CompleteBulletRequest {
  string id      = 1;
  string user_id = 2;
}

message CompleteBulletResponse {
  Bullet data = 1;
}

message MigrateBulletRequest {
  string id      = 1;
  string user_id = 2;
}

message MigrateBulletResponse {
  Bullet data = 1;
}

message CancelBulletRequest {
  string id      = 1;
  string user_id = 2;
}

message CancelBulletResponse {
  Bullet data = 1;
}

service JournalService {
  rpc CreateBullet(CreateBulletRequest) returns (CreateBulletResponse) {}
  rpc ListBullets(ListBulletsRequest) returns (ListBulletsResponse) {}
  rpc CompleteBullet(CompleteBulletRequest) returns (CompleteBulletResponse) {}
  rpc MigrateBullet(MigrateBulletRequest) returns (MigrateBulletResponse) {}
  rpc CancelBullet(CancelBulletRequest) returns (CancelBulletResponse) {}
}
