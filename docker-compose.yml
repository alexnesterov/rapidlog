services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api
    restart: always
    ports:
      - "1509:1508"
    environment:
      - RAPIDLOG_DB_DSN=postgres://rapidlog:rapidlog@db:5432/rapidlog
      - RAPIDLOG_HTTP_PORT=1508
    depends_on:
      - db

  db:
    container_name: postgres
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: rapidlog
      POSTGRES_PASSWORD: rapidlog
      POSTGRES_DB: rapidlog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "rapidlog" ]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    container_name: adminer
    image: adminer
    restart: always
    ports:
      - 8080:8080
    depends_on:
      - db

volumes:
  postgres_data:
