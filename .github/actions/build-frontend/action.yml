name: Build frontend
description: Install dependencies and build the web frontend
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install and build
      shell: bash
      working-directory: web
      run: |
        npm ci
        npm run build
