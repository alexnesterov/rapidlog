services:
  gate:
    build:
      context: .
      dockerfile: Dockerfile
      target: gate
    container_name: gate
    restart: always
    ports:
      - '${GATE_PORT}:8080'
    environment:
      - GATE_DSN=${GATE_DSN}
      - GATE_IDENTITY=${GATE_IDENTITY}
    depends_on:
      - identity

  identity:
    build:
      context: .
      dockerfile: Dockerfile
      target: identity
    container_name: identity
    restart: always
    environment:
      - IDENTITY_DB_DSN=${IDENTITY_DB_DSN}
