services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    container_name: gateway
    restart: unless-stopped
    ports:
      - '${GATEWAY_PORT}:8080'
    environment:
      - GATEWAY_IDENTITY=${GATEWAY_IDENTITY}
      - GATEWAY_JOURNAL=${GATEWAY_JOURNAL}
    depends_on:
      - identity
      - journal

  identity:
    build:
      context: .
      dockerfile: Dockerfile
      target: identity
    container_name: identity
    restart: unless-stopped
    environment:
      - IDENTITY_DSN=${IDENTITY_DSN}

  journal:
    build:
      context: .
      dockerfile: Dockerfile
      target: journal
    container_name: journal
    restart: unless-stopped
    environment:
      - JOURNAL_DSN=${JOURNAL_DSN}
