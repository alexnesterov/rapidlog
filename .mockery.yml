all: false
dir: '{{.InterfaceDir}}/mocks'
filename: 'mock_{{.InterfaceFile | base | trimSuffix ".go"}}.go'
force-file-write: true
formatter: goimports
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: mocks
recursive: false
template: testify
packages:
